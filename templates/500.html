{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center;">
    <h2 style="font-size: 3rem; color: #dc3545;">500</h2>
    <p style="font-size: 1.2rem; color: #666; margin-bottom: 1.5rem;">Server Error</p>
    <p style="color: #999; margin-bottom: 1.5rem;">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" style="display: inline-block; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 5px; transition: all 0.3s;">
        Go Home
    </a>
</div>
{% endblock %}
